# values-tempo.yaml
global:
  storageClass: longhorn

traces:
  otlp:
    grpc:
      enabled: true

metaMonitoring:
  dashboards:
    enabled: false
  serviceMonitor:
    enabled: false

# Keep size small
compactor:
  replicas: 1
distributor:
  replicas: 1
ingester:
  replicas: 1
querier:
  replicas: 1
queryFrontend:
  replicas: 1
memcached:
  enabled: false

# Use filesystem storage for simplicity
storage:
  trace:
    backend: filesystem
    filesystem:
      dir: /var/tempo/traces
